<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atatrace · Beautiful UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="shell" id="app" data-home="true">
    <aside class="nav">
      <button class="brand" type="button" id="homeBtn" aria-label="Back to home"><i class="mark"></i><b>Atatrace</b><em>ledger</em></button>
      <div class="nav-label">Sessions</div>
      <div id="sessTabs" class="sess-tabs" role="group" aria-label="Filter by agent"></div>
      <div id="sessList"></div>
    </aside>
    <main class="stage">
      <header class="top">
        <button class="ghost" id="navToggle" type="button" aria-pressed="false" title="收起/展开侧栏">◧</button>
        <div class="crumb" id="crumb">选择一条会话</div>
        <button class="ghost" id="refreshBtn" type="button" title="重新拉取当前会话的最新数据（原地更新，不改变选中与滚动位置）">⟳ 刷新</button>
        <button class="follow-toggle" id="live" type="button" aria-pressed="true"><span class="dot"></span><span class="txt">跟随尾部</span></button>
        <div class="grow"></div>
        <!-- 标注/归组收成 Badge + 弹出层：低频会话级动作不常驻占版面 -->
        <span class="popwrap">
          <button class="stat-badge anno-badge" id="scoreBadgeBtn" type="button" aria-expanded="false" aria-controls="scoreBox" hidden>
            <span class="adot" id="scoreDot"></span><span>标注</span><b id="annoBadgeText">未标注</b>
          </button>
          <div class="pop" id="scoreBox" hidden>
            <div class="pop-title">标注本条会话</div>
            <div class="pop-row">
              <button class="ghost" type="button" data-score="good">Good</button>
              <button class="ghost" type="button" data-score="bad">Bad</button>
              <button class="ghost" type="button" data-score="partial">Partial</button>
            </div>
            <input class="score-note" id="scoreNote" type="text" placeholder="备注（可选）" maxlength="200" />
          </div>
        </span>
        <span class="popwrap">
          <button class="stat-badge" id="assignBadgeBtn" type="button" aria-expanded="false" aria-controls="assignBox" hidden>
            <span>归组</span><span class="caret">▾</span>
          </button>
          <div class="pop" id="assignBox" hidden>
            <div class="pop-title">归组到回归轮次</div>
            <select id="assignRun"><option value="">选 run…</option></select>
            <input class="score-note" id="assignTask" type="text" placeholder="任务 id（t-xxxx）" maxlength="40" />
            <button class="ghost" type="button" id="assignBtn">归入</button>
          </div>
        </span>
        <div class="divider"></div>
        <input class="search" id="q" type="search" placeholder="Search" aria-label="Search trajectory" />
        <button class="theme-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">☾</button>
      </header>
      <div class="home-empty" id="homeEmpty">选择一条会话</div>
      <section class="overview">
        <div class="zone-bar">
          <span class="zone-name">Timeline</span>
          <!-- 时间轴固定 Sequence 视图：Actual time / Duration / Usage 已移除（决策见提交说明） -->
          <button class="stat-badge" id="statBadge" aria-expanded="false" type="button" title="工具调用统计" hidden>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.7 19 13.6 9.9c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1 .1-1.4z"/></svg>
            <span id="badgeText"></span>
          </button>
          <button class="stat-badge" id="usageBadge" aria-expanded="false" type="button" title="Usage 全周期与可信度" hidden>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8v6h2V4h-10v2h6l-6 6-4-4-7 7z"/></svg>
            <span id="usageBadgeText"></span>
          </button>
        </div>
        <div class="panel-wrap">
          <div class="stats-panel" id="statsPanel" hidden>
            <div class="sp-head">
              <b>工具调用统计</b>
              <span class="sum" id="statSum"></span>
              <span class="urate" id="urate" hidden></span>
              <button class="sp-close" id="statClose" type="button" aria-label="关闭统计面板">×</button>
            </div>
            <div class="sp-body">
              <div class="dtable">
                <div class="dhead"><span class="h-tool">Tool</span><span class="h-n">Calls</span><span class="h-n">Failed</span></div>
                <div id="distRows"></div>
              </div>
              <div class="hint">按失败数 → 调用数降序 · 点击行按时间顺序展开每次调用 · 点击调用跳转轨迹现场</div>
            </div>
          </div>
        </div>
        <div class="panel-wrap">
          <div class="stats-panel" id="usagePanel" hidden>
            <div class="sp-head">
              <b>Usage 全周期</b>
              <span class="sum" id="usageSum"></span>
              <button class="sp-close" id="usageClose" type="button" aria-label="关闭 Usage 面板">×</button>
            </div>
            <div class="sp-body">
              <div class="ucurve-wrap" id="usageCurve"></div>
              <details class="ufindings" id="usageFindingsWrap" hidden>
                <summary id="usageFindingsSum"></summary>
                <div id="usageFindings"></div>
              </details>
              <div class="hint">上层 context 占用 · 下层缓存命中率 · 竖线=compaction（含落差标注）· 红点=体检发现 · 断口=missing · 悬停看明细，点击跳转轨迹</div>
            </div>
          </div>
        </div>
        <div class="plot">
          <div class="labels" aria-hidden="true"><span>Input</span><span>Model</span><span>Tools</span></div>
          <div class="track" id="track" tabindex="0" aria-label="Timeline overview; drag horizontally to focus events">
            <button class="ellipsis" id="earlier" type="button" hidden title="Load earlier history">…</button>
            <div class="selection" id="selFill" hidden></div>
            <div class="selection-edges" id="selEdge" hidden></div>
            <div class="hover-line" id="hoverLine" hidden></div>
            <div class="turn-lines" id="turnLines"></div>
            <div class="lanes" id="lanes"></div>
          </div>
        </div>
      </section>
      <section class="ledger">
        <div class="ledger-main">
          <div class="zone-bar">
            <span class="zone-name">Ledger</span>
            <!-- 过滤器归位列头、视图开关收进菜单：操作不再与区名并排 -->
            <div class="grow"></div>
            <code class="sid" id="sidBox" hidden></code>
            <button class="ghost" id="copySidBtn" hidden type="button" title="复制 session id">⧉</button>
            <div class="viewmenu">
              <button class="ghost" id="viewMenuBtn" type="button" aria-expanded="false" aria-controls="viewMenu">视图 ▾</button>
              <div class="pop" id="viewMenu" hidden>
                <button class="ghost vmi" id="turnsBtn" aria-pressed="false" title="Collapse turns"><span class="ico">⊟</span>折叠所有轮次</button>
                <button class="ghost vmi" id="callsBtn" aria-pressed="false" title="Collapse calls"><span class="ico">⊟</span>折叠所有调用</button>
              </div>
            </div>
          </div>
          <div class="table-wrap" id="scroller">
            <table>
              <thead>
                <tr>
                  <th class="idx">#</th>
                  <th class="evt">Event</th>
                  <th>Content
                    <span class="th-filters">
                      <button class="ghost chip" id="failChip" aria-pressed="false" type="button" title="只看失败的行"><span class="ico">●</span>Failed</button>
                      <button class="ghost chip" id="toolChip" aria-pressed="false" type="button" title="只看工具调用"><span class="ico">▣</span>Tools</button>
                    </span>
                  </th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
        <aside class="details" id="details">
          <div class="resize" id="resize" role="separator" aria-orientation="vertical" aria-label="Resize event details" tabindex="0" title="Drag to resize. Double-click to reset."></div>
          <!-- 会话上下文抽屉：System Prompt / Tools / Skills 常驻右栏顶部，默认折叠成一行摘要条 -->
          <div class="ctx" id="ctx" hidden>
            <button class="ctx-bar" id="ctxBar" type="button" aria-expanded="false" aria-controls="ctxPanel">
              <span class="caret">▸</span><span id="ctxSummary"></span>
            </button>
            <div class="ctx-panel" id="ctxPanel" hidden>
              <div class="tabs ctx-tabs" id="ctxTabs" role="tablist"></div>
              <div class="ctx-body" id="ctxBody"></div>
            </div>
          </div>
          <div class="d-h" id="dHead">
            <div class="d-title">
              <span class="kind" id="dTag">TOOL</span>
              <span class="d-loc" id="dLoc">Turn 2 · Step 1</span>
            </div>
          </div>
          <div class="tabs" id="tabs" role="tablist"></div>
          <div class="d-body" id="dBody"></div>
          <div class="d-empty" id="dEmpty" hidden>点击事件查看详情</div>
        </aside>
        <!-- 右缘细把手：点击折叠/展开详情栏，折叠后把手留在屏幕右缘 -->
        <button class="collapse-handle" id="detailsHandle" type="button" title="收起/展开详情栏" aria-label="收起/展开详情栏"></button>
      </section>
    </main>
  </div>
  <div class="tip" id="tip"></div>
    <!-- vendored 本地库（web/vendor/README.md 记录来源与许可证），无构建、无运行期下载 -->
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <!-- 拆分模块：普通 script 共享全局作用域，必须按此顺序加载 -->
    <script src="js/util.js"></script>
    <script src="js/state.js"></script>
    <script src="js/model.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/table.js"></script>
    <script src="js/inspector.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/usage.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
