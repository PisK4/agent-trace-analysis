<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atatrace · Beautiful UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page: #FAFAFB;
      --canvas: #F1F2F3;
      --surface: #FFFFFF;
      --field: #F2F2F3;
      --inset: #F7F8F9;
      --hover: #F4F5F6;
      --hover-2: #E7E9EB;
      --line: #ECEDEF;
      --line-strong: #E0E2E5;
      --ink: #1F2124;
      --ink-2: #62656B;
      --ink-3: #9A9DA3;
      --accent: #0285FF;
      --accent-ink: #0170DD;
      --accent-tint: #E9F3FF;
      --green: #189A4D;
      --green-tint: #E8F5ED;
      --orange: #EF720C;
      --orange-tint: #FDF1E5;
      --red: #E3474C;
      --red-tint: #FCECEC;
      --assistant: #7A4FD3;
      --assistant-tint: #F1E9FF;
      --cyan: #0E8AA8;
      --cyan-tint: #E6F6FA;
      --pink: #DB2777;
      --pink-tint: #FCE7F3;
      --stripe: #49494913;
      --tooltip: #1A1B1E;
      --json-key: #7A3E9D;
      --json-str: #B42318;
      --json-num: #1F6FEB;
      --shadow-btn: 0 0 0 1px #E0E2E5, 0 1px 2px #1018280D;
      --shadow-card: 0 0 0 1px #ECEDEF, 0 1px 2px #1018280A, 0 2px 6px #10182808;
      --shadow-overlay: 0 0 0 1px #ECEDEF, 0 8px 28px #0001;
      --shadow-inset-field: inset 0 1px 2px #0000001F;
      --row-h: 30px;
      --summary-h: 20px;
    }
    html.dark {
      color-scheme: dark;
      --page: #17181A;
      --canvas: #1C1D1F;
      --surface: #232427;
      --field: #2B2C2F;
      --inset: #1F2022;
      --hover: #2A2B2E;
      --hover-2: #313236;
      --line: #2E3033;
      --line-strong: #3A3C40;
      --ink: #F2F3F4;
      --ink-2: #A5A8AD;
      --ink-3: #6C6F75;
      --accent: #3D9AFF;
      --accent-ink: #7EC0FF;
      --accent-tint: #3D9AFF29;
      --green: #3DBB72;
      --green-tint: #3DBB7224;
      --orange: #F68F3C;
      --orange-tint: #F68F3C24;
      --red: #EE5C61;
      --red-tint: #EE5C6124;
      --assistant: #8B8DFF;
      --assistant-tint: #8B8DFF24;
      --cyan: #22D3EE;
      --cyan-tint: #22D3EE24;
      --pink: #F472B6;
      --pink-tint: #F472B624;
      --stripe: #FFFFFF0E;
      --tooltip: #111214;
      --json-key: #C792EA;
      --json-str: #F07178;
      --json-num: #79C0FF;
      --shadow-btn: 0 0 0 1px #3A3C40, 0 1px 2px #0000004D;
      --shadow-card: 0 0 0 1px #2E3033, 0 1px 2px #0003, 0 2px 6px #0003;
      --shadow-overlay: 0 0 0 1px #3A3C40, 0 8px 28px #00000057;
      --shadow-inset-field: inset 0 1px 2px #0006;
    }
    html:not(.dark) { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--page);
      background-image: repeating-linear-gradient(-45deg, transparent 0, transparent 7px, var(--stripe) 7px, var(--stripe) 8px);
      color: var(--ink);
      font: 13px/19.5px Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -.01em;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; }
    button:focus-visible, input:focus-visible, .span:focus-visible, .track:focus-visible, .resize:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -1px;
    }
    .shell {
      display: grid;
      grid-template-columns: 228px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      border-radius: 0;
      background: var(--canvas);
      box-shadow: var(--shadow-overlay);
    }
    .nav {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--page);
      box-shadow: inset -1px 0 0 var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      padding: 0 14px;
      text-align: left;
    }
    .brand:hover { background: var(--hover); }
    .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); }
    .brand b { font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
    .brand em { color: var(--ink-3); font-style: normal; font-size: 12px; }
    .nav-label {
      padding: 8px 14px 4px;
      color: var(--ink-3);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .sess-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0 2px;
      margin: 0 10px 6px;
      padding: 0;
      box-shadow: inset 0 -1px 0 var(--line);
    }
    .sess-tabs .tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 8px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink-3);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1;
    }
    .sess-tabs .tab .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--agent, var(--ink-3));
    }
    .sess-tabs .tab:hover { color: var(--ink); }
    .sess-tabs .tab[aria-pressed="true"] {
      color: var(--ink);
      font-weight: 600;
      background: var(--agent-soft, var(--hover));
      box-shadow: inset 0 -1.5px 0 var(--agent, var(--ink));
    }
    .agent-claude { --agent: var(--orange); --agent-soft: var(--orange-tint); }
    .agent-codex { --agent: var(--green); --agent-soft: var(--green-tint); }
    .agent-pi { --agent: var(--ink); --agent-soft: var(--hover); }
    .agent-droid { --agent: var(--cyan); --agent-soft: var(--cyan-tint); }
    .agent-cue { --agent: var(--pink); --agent-soft: var(--pink-tint); }
    #sessList { display: flex; flex-direction: column; gap: 6px; padding: 4px 10px 12px; }
    .item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 2px 8px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--agent-soft, var(--hover));
      box-shadow: var(--shadow-card);
      color: var(--ink-2);
      text-align: left;
    }
    .item:hover { box-shadow: var(--shadow-overlay); }
    .item[aria-current="true"] {
      color: var(--ink);
      font-weight: 500;
      box-shadow: var(--shadow-overlay);
      transform: translateY(-1px);
    }
    .item .t { grid-column: 1 / -1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
    .item small { color: var(--ink-3); font-size: 11px; font-family: "JetBrains Mono", ui-monospace, monospace; }
    .item small.agent { color: var(--agent, var(--ink-3)); }
    .home-empty {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      color: var(--ink-3);
      font-size: 13px;
    }
    .shell[data-home="true"] .overview,
    .shell[data-home="true"] .ledger,
    .shell[data-home="true"] .follow,
    .shell[data-home="true"] .mode-chip,
    .shell[data-home="true"] #durBtn,
    .shell[data-home="true"] #timeBtn,
    .shell[data-home="true"] #turnsBtn,
    .shell[data-home="true"] #callsBtn,
    .shell[data-home="true"] #followBtn,
    .shell[data-home="true"] .search { display: none; }
    .shell[data-home="true"] .home-empty { display: flex; }
    .stage { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: var(--surface); }
    .top {
      display: flex;
      align-items: center;
      height: 36px;
      padding: 0 10px;
      gap: 6px;
      box-shadow: inset 0 -1px 0 var(--line);
    }
    .crumb { color: var(--ink-2); font-size: 12px; }
    .crumb b { color: var(--ink); font-weight: 500; }
    .grow { flex: 1; }
    .ghost {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      color: var(--ink-3);
      font-size: 12px;
    }
    .ghost:hover, .ghost[aria-pressed="true"] { background: var(--hover-2); color: var(--ink); }
    .ghost .ico { font-size: 12px; line-height: 1; }
    .mode-chip {
      color: var(--ink-3);
      font: 10.5px/16px "JetBrains Mono", ui-monospace, monospace;
    }
    .search {
      width: 168px;
      height: 24px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      background: var(--field);
      box-shadow: var(--shadow-inset-field);
      font-size: 12px;
    }
    .seg {
      display: inline-flex;
      height: 24px;
      padding: 2px;
      border-radius: 999px;
      background: var(--field);
    }
    .seg button {
      height: 20px;
      padding: 0 8px;
      border-radius: 999px;
      color: var(--ink-3);
      font-size: 11px;
    }
    .seg button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-btn);
    }
    .follow { color: var(--ink-3); font-size: 11px; }
    .follow[data-on="true"] { color: var(--accent-ink); }

    .overview { flex: none; border-bottom: 1px solid var(--line); user-select: none; }
    .plot {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      height: 50px;
      background: var(--inset);
    }
    .labels { position: relative; border-right: 1px solid var(--line); color: var(--ink-3); font-size: 10px; }
    .labels span { position: absolute; right: 4px; height: 8px; line-height: 8px; }
    .labels span:nth-child(1) { top: 7px; }
    .labels span:nth-child(2) { top: 21px; }
    .labels span:nth-child(3) { top: 35px; }
    .track { position: relative; overflow: hidden; cursor: crosshair; touch-action: none; }
    .track[data-panning="true"] { cursor: grabbing; }
    .ellipsis {
      position: absolute; z-index: 5; left: 0; top: 0; bottom: 0; width: 28px;
      color: var(--ink-3);
      background: linear-gradient(to right, var(--inset) 0, var(--inset) 38%, transparent 100%);
      text-align: left; padding-left: 3px;
    }
    .ellipsis[hidden] { display: none; }
    .ellipsis[disabled] { opacity: .45; }
    .lanes, .turn-lines {
      position: absolute; inset: 7px 0;
      left: var(--domain-left); width: var(--domain-width);
    }
    .turn-lines { inset: 0; pointer-events: none; z-index: 3; }
    .turn-line {
      position: absolute; top: 0; bottom: 0; left: var(--left);
      width: 1px; background: var(--line-strong);
    }
    .span {
      position: absolute;
      top: calc(var(--lane) * 14px);
      left: calc(var(--left) + var(--gap));
      width: max(2px, calc(var(--width) - var(--gap) - var(--gap)));
      height: 8px;
      min-width: 2px;
      border-radius: 1px;
      background: var(--ink-3);
      opacity: .78;
    }
    .span.user { background: var(--green); opacity: 1; }
    .span.context { background: color-mix(in srgb, var(--green) 68%, var(--ink-3)); opacity: 1; }
    .span.assistant { background: var(--assistant); opacity: 1; }
    .span.assistant[data-ttft] {
      background: linear-gradient(to right,
        color-mix(in srgb, var(--assistant) 54%, var(--inset)) 0,
        color-mix(in srgb, var(--assistant) 54%, var(--inset)) var(--ttft),
        var(--assistant) var(--ttft),
        var(--assistant) 100%);
    }
    .span.tool, .span.subtool { background: var(--orange); opacity: 1; }
    .span.compacted { background: var(--ink-3); }
    .span.system { background: var(--ink-3); opacity: .78; }
    .span[data-error="true"] { background: var(--red); opacity: 1; }
    .span[data-equal="true"] { width: 8px; min-width: 8px; }
    .span[data-in-range="false"] { opacity: .2; }
    .span[data-search="false"] { opacity: .14; }
    .span[data-current="true"], .span[data-hovered="true"] {
      z-index: 2; opacity: 1;
      box-shadow: 0 0 0 1px var(--surface), 0 0 0 2px var(--accent);
    }
    .selection, .selection-edges {
      position: absolute; top: 0; bottom: 0;
      left: var(--sel-left); width: var(--sel-width);
      min-width: 1px; pointer-events: none;
    }
    .selection {
      z-index: 1;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow:
        -100vw 0 0 100vw color-mix(in srgb, var(--page) 58%, transparent),
        100vw 0 0 100vw color-mix(in srgb, var(--page) 58%, transparent);
    }
    .selection[data-draft="true"] {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .selection-edges { z-index: 4; }
    .selection-edges::before, .selection-edges::after {
      content: "";
      position: absolute; top: 0; bottom: 0; width: 3px;
      background: var(--accent);
    }
    .selection-edges[data-draft="true"]::before,
    .selection-edges[data-draft="true"]::after { width: 2px; }
    .selection-edges::before { left: 0; }
    .selection-edges::after { right: 0; }
    .hover-line {
      position: absolute; z-index: 4; top: 0; bottom: 0;
      left: var(--hover-left); width: 2px;
      background: var(--accent); pointer-events: none;
    }
    .tip {
      position: fixed; z-index: 20;
      display: none;
      max-width: 280px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--tooltip);
      color: #F4F5F6;
      font: 11px/16px "JetBrains Mono", ui-monospace, monospace;
      box-shadow: 0 8px 24px #0006;
      pointer-events: none;
      white-space: pre-line;
    }
    .tip[data-on="true"] { display: block; }

    .ledger { display: flex; flex: 1; min-height: 0; }
    .table-wrap { flex: 1; min-width: 280px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th {
      position: sticky; top: 0; z-index: 2;
      height: var(--row-h);
      padding: 0 8px;
      background: var(--inset);
      border-bottom: 1px solid var(--line-strong);
      color: var(--ink-3);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
    }
    td {
      height: var(--row-h);
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      vertical-align: middle;
    }
    .idx { width: 92px; color: var(--ink-3); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; }
    .evt { width: 132px; text-align: left; position: relative; overflow: visible; padding-left: 28px; }
    tbody tr { cursor: default; }
    tbody tr:hover { background: var(--hover); }
    tbody tr[data-selected="true"] { background: var(--accent-tint); }
    tbody tr[data-focus="out"] { opacity: .24; }
    tbody tr[data-error="true"] .kind { color: var(--red); background: var(--red-tint); }
    tbody tr[data-pending="true"] .kind { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--orange) 55%, transparent); }
    tbody tr[data-turn-start="true"] td { position: relative; }
    tbody tr[data-turn-start="true"]:not(:first-child) td::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 0;
      height: 2px; background: var(--line-strong); transform: translateY(-50%);
    }
    tr.summary td { height: var(--summary-h); color: var(--ink-3); font-size: 11px; }
    tr.older td { height: var(--row-h); color: var(--ink-2); }
    tr.spacer td { padding: 0; border: 0; height: var(--h); }
    .turn-chip, .req-chip {
      display: inline-flex; align-items: center;
      height: 16px; margin-left: 6px; padding: 0 4px;
      border-radius: 4px; background: var(--field); color: var(--ink-3);
      font: 10px/12px "JetBrains Mono", ui-monospace, monospace;
      vertical-align: middle;
    }
    .req-dot {
      position: absolute; z-index: 4; left: 8px; top: 50%;
      width: 16px; height: 16px; margin: -8px 0 0;
      border: 0; background: transparent; cursor: pointer;
    }
    .req-dot::before {
      content: "";
      position: absolute; top: 5.5px; left: 5.5px;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--ink-3);
      box-shadow: 0 0 0 2px var(--surface);
    }
    .req-dot:hover::before, .req-dot:focus-visible::before,
    .req-dot[data-active="true"]::before { background: var(--accent); }
    .req-dot[data-error="true"]::before { background: var(--red); }
    .req-dot span {
      display: none; position: absolute; left: 16px; top: -1px;
      padding: 1px 5px; border-radius: 2px; background: var(--surface);
      border: 1px solid var(--line-strong); color: var(--ink-2);
      font: 9px/12px "JetBrains Mono", ui-monospace, monospace; white-space: nowrap; z-index: 5;
    }
    .req-dot:hover span, .req-dot:focus-visible span { display: block; }
    .kind {
      display: inline-flex; align-items: center;
      height: 20px; padding: 0 6px; border-radius: 6px;
      font-size: 10.5px; font-weight: 650; letter-spacing: .03em;
      vertical-align: middle;
    }
    .kind.user, .kind.context { color: var(--green); background: var(--green-tint); }
    .kind.assistant { color: var(--assistant); background: var(--assistant-tint); }
    .kind.tool, .kind.subtool { color: var(--orange); background: var(--orange-tint); }
    .kind.compacted, .kind.system { color: var(--ink-2); background: var(--field); }
    .kind.request { color: var(--accent-ink); background: var(--accent-tint); }
    .req-chip-dot {
      display: inline-block; width: 6px; height: 6px; margin-right: 6px;
      border-radius: 50%; background: var(--accent); vertical-align: middle;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; color: var(--ink-2); }
    .subtool .content { padding-left: 26px; }

    .details {
      display: none;
      position: relative;
      width: clamp(320px, 38%, 440px);
      max-width: calc(100% - 280px);
      min-width: 320px;
      flex-direction: column;
      min-height: 0;
      border-left: 1px solid var(--line-strong);
      background: var(--surface);
    }
    .shell[data-inspect="open"] .details { display: flex; }
    .resize {
      position: absolute; left: -4px; top: 0; bottom: 0; width: 8px;
      cursor: col-resize; z-index: 3;
    }
    .d-h {
      display: flex; align-items: center; justify-content: space-between;
      height: 42px; padding: 0 8px 0 12px;
      border-bottom: 1px solid var(--line-strong);
    }
    .d-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .d-loc {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--ink-3); font: 11px/16px "JetBrains Mono", ui-monospace, monospace;
    }
    .x { width: 28px; height: 28px; border-radius: 6px; color: var(--ink-2); font-size: 18px; }
    .x:hover { background: var(--hover); color: var(--ink); }
    .tabs {
      display: flex; height: 34px; padding: 0 8px;
      border-bottom: 1px solid var(--line-strong);
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      position: relative; flex: none; height: 34px; padding: 0 9px;
      color: var(--ink-3); font-size: 13px;
    }
    .tab:hover { color: var(--ink); background: var(--hover); }
    .tab[aria-selected="true"] { color: var(--accent-ink); }
    .tab[aria-selected="true"]::after {
      content: "";
      position: absolute; left: 9px; right: 9px; bottom: 0;
      height: 2px; border-radius: 1px 1px 0 0; background: var(--accent);
    }
    .d-body { flex: 1; min-height: 0; overflow: auto; }
    .kv { margin: 0; padding: 6px 0; }
    .kv > div {
      display: grid; grid-template-columns: 94px minmax(0, 1fr);
      min-height: 22px; padding: 0 14px; align-items: center;
    }
    .kv dt { color: var(--ink-3); }
    .kv dd { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .jump, .stamp {
      display: inline-flex; align-items: center; gap: 2px;
      color: var(--ink-2);
    }
    .jump:hover, .stamp:hover { color: var(--ink); }
    .jump i { color: var(--ink-3); font-style: normal; }
    .sec { padding: 2px 14px 8px; }
    .sec-h {
      display: flex; width: 100%; align-items: center; justify-content: space-between;
      margin-bottom: 6px; color: var(--ink-2); font-size: 12.5px; font-weight: 500;
    }
    .sec-h:hover { color: var(--ink); }
    .json, .blob, .schema-box, .md {
      margin: 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--inset);
      color: var(--ink);
      font: 12px/18px "JetBrains Mono", ui-monospace, monospace;
      white-space: pre-wrap;
      overflow: auto;
    }
    .md {
      font: 12.5px/19px Inter, sans-serif;
      white-space: normal;
      overflow-wrap: break-word;
    }
    .md > :first-child { margin-top: 0; }
    .md p { margin: 0 0 8px; }
    .md h1, .md h2, .md h3, .md h4 { margin: 10px 0 6px; font-weight: 600; line-height: 1.3; }
    .md h1 { font-size: 16px; } .md h2 { font-size: 15px; }
    .md h3 { font-size: 14px; } .md h4 { font-size: 13px; }
    .md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
    .md li { margin: 2px 0; }
    .md a { color: var(--accent-ink); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md blockquote {
      margin: 0 0 8px; padding: 2px 10px;
      border-left: 3px solid var(--line-strong); color: var(--ink-2);
    }
    .md code {
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
      background: var(--field); padding: 1px 4px; border-radius: 4px;
    }
    .md pre { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--inset); overflow: auto; }
    .md pre code { background: none; padding: 0; display: block; }
    .md table { margin: 0 0 8px; border-collapse: collapse; font-size: 12px; width: 100%; }
    .md th, .md td { padding: 4px 8px; border: 1px solid var(--line-strong); text-align: left; }
    .md th { background: var(--field); font-weight: 500; }
    .md hr { border: 0; border-top: 1px solid var(--line-strong); margin: 10px 0; }
    .md img { max-width: 100%; border-radius: 6px; }
    /* highlight.js 的 token 色走主题变量，明暗主题同一份规则 */
    .hljs-keyword, .hljs-selector-tag { color: var(--json-key); font-weight: 500; }
    .hljs-string, .hljs-regexp, .hljs-addition { color: var(--json-str); }
    .hljs-number, .hljs-literal { color: var(--json-num); }
    .hljs-comment, .hljs-quote { color: var(--ink-3); font-style: italic; }
    .hljs-title, .hljs-title.function_, .hljs-section, .hljs-selector-id { color: var(--accent-ink); }
    .hljs-attr, .hljs-attribute, .hljs-property, .hljs-params, .hljs-selector-attr { color: var(--orange); }
    .hljs-built_in, .hljs-type, .hljs-title.class_ { color: var(--green); }
    .hljs-variable, .hljs-name, .hljs-selector-class { color: var(--assistant); }
    .hljs-meta, .hljs-meta .hljs-keyword { color: var(--ink-3); }
    .hljs-emphasis { font-style: italic; }
    .hljs-strong { font-weight: 600; }
    .hljs-deletion { color: var(--red); }
    .tree { font: 12px/18px "JetBrains Mono", ui-monospace, monospace; }
    .tree details { margin-left: 12px; }
    .tree > details { margin-left: 0; }
    .tree summary { cursor: pointer; color: var(--ink-2); }
    .k { color: var(--json-key); }
    .s { color: var(--json-str); }
    .n { color: var(--json-num); }
    .schema-box h3 { font: 600 13px/18px Inter, sans-serif; margin-bottom: 4px; }
    .schema-box p { color: var(--ink-2); font: 12.5px/18px Inter, sans-serif; }
    .miss { color: var(--ink-3); }
    .usage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .u-cell {
      min-height: 52px; padding: 8px 10px; border-radius: 8px;
      background: var(--inset);
    }
    .u-cell span { display: block; color: var(--ink-3); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; }
    .u-cell b { display: block; margin-top: 4px; font: 500 14px/18px "JetBrains Mono", ui-monospace, monospace; }
    .think {
      margin: 0 0 8px;
      border-radius: 8px;
      background: var(--inset);
    }
    .think summary { padding: 6px 10px; cursor: pointer; color: var(--ink-2); }
    .think pre { margin: 0; padding: 0 10px 8px; }
    .think-body { margin: 0 0 8px; }
    details.tool-card {
      margin: 8px 14px;
      border-radius: 8px;
      background: var(--inset);
    }
    details.tool-card summary { padding: 6px 10px; cursor: pointer; }
    details.tool-card .inner { padding: 0 10px 8px; }
    .diff { color: var(--ink-2); }
    .diff .add { color: var(--green); }
    .diff .del { color: var(--red); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell" id="app" data-home="true">
    <aside class="nav">
      <button class="brand" type="button" id="homeBtn" aria-label="Back to home"><i class="mark"></i><b>Atatrace</b><em>ledger</em></button>
      <div class="nav-label">Sessions</div>
      <div id="sessTabs" class="sess-tabs" role="group" aria-label="Filter by agent"></div>
      <div id="sessList"></div>
    </aside>
    <main class="stage">
      <header class="top">
        <div class="crumb" id="crumb">选择一条会话</div>
        <span class="follow" id="live" data-on="true">跟随尾部</span>
        <span class="mode-chip" id="modeChip">sequence</span>
        <div class="grow"></div>
        <button class="ghost" id="durBtn" aria-pressed="false" title="Use actual duration">Duration</button>
        <button class="ghost" id="timeBtn" aria-pressed="false" title="Use actual time">Actual time</button>
        <button class="ghost" id="turnsBtn" aria-pressed="false" title="Collapse turns"><span class="ico">⊟</span>Turns</button>
        <button class="ghost" id="callsBtn" aria-pressed="false" title="Collapse calls"><span class="ico">⊟</span>Calls</button>
        <button class="ghost" id="followBtn" aria-pressed="true">跟随</button>
        <div class="seg" role="group" aria-label="主题">
          <button type="button" data-theme="dark">Dark</button>
          <button type="button" data-theme="light" aria-pressed="true">Light</button>
        </div>
        <input class="search" id="q" type="search" placeholder="Search" aria-label="Search trajectory" />
      </header>
      <div class="home-empty" id="homeEmpty">选择一条会话</div>
      <section class="overview">
        <div class="plot">
          <div class="labels" aria-hidden="true"><span>Input</span><span>Model</span><span>Tools</span></div>
          <div class="track" id="track" tabindex="0" aria-label="Timeline overview; drag horizontally to focus events">
            <button class="ellipsis" id="earlier" type="button" hidden title="Load earlier history">…</button>
            <div class="selection" id="selFill" hidden></div>
            <div class="selection-edges" id="selEdge" hidden></div>
            <div class="hover-line" id="hoverLine" hidden></div>
            <div class="turn-lines" id="turnLines"></div>
            <div class="lanes" id="lanes"></div>
          </div>
        </div>
      </section>
      <section class="ledger">
        <div class="table-wrap" id="scroller">
          <table>
            <thead>
              <tr>
                <th class="idx">#</th>
                <th class="evt">Event</th>
                <th>Content</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <aside class="details" id="details">
          <div class="resize" id="resize" role="separator" aria-orientation="vertical" aria-label="Resize event details" tabindex="0" title="Drag to resize. Double-click to reset."></div>
          <div class="d-h">
            <div class="d-title">
              <span class="kind" id="dTag">TOOL</span>
              <span class="d-loc" id="dLoc">Turn 2 · Step 1</span>
            </div>
            <button class="x" id="close" type="button" aria-label="Close details">×</button>
          </div>
          <div class="tabs" id="tabs" role="tablist"></div>
          <div class="d-body" id="dBody"></div>
        </aside>
      </section>
    </main>
  </div>
  <div class="tip" id="tip"></div>
    <!-- vendored 本地库（web/vendor/README.md 记录来源与许可证），无构建、无运行期下载 -->
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script>
    const MINIMUM_DRAG_PX = 3;
    const MINIMUM_ZOOM_OPERATIONS = 4;
    const EDGE_PAN_ZONE_FRACTION = 0.08;
    const EDGE_PAN_STEP_FRACTION = 0.025;
    const MAXIMUM_EDGE_PAN_PX = 32;
    const TIMELINE_TOOLTIP_DELAY_MS = 500;
    const VIRTUAL_THRESHOLD = 100;
    const OVERSCAN = 12;
    const CONTENT_ROW_HEIGHT = 30;
    const COLLAPSED_SUMMARY_HEIGHT = 20;
    const DETAILS_MIN = 320;
    const DETAILS_MAX = 720;
    const TABLE_MIN = 280;
    const DETAILS_STEP = 16;
    const LOAD_NEAR_TOP = 48;

    const at = (hms) => {
      const [hour, minute, rest] = hms.split(":");
      const [second, millis = "0"] = rest.split(".");
      return new Date(2026, 7, 14, Number(hour), Number(minute), Number(second), Number(millis)).getTime();
    };
    const API = "";
    let sessions = [];

    const emptyUsage = () => ({ status: "n/a", input: null, output: null, cacheRead: null, cacheWrite: null });

    async function fetchJSON(path) {
      const res = await fetch(API + path);
      if (!res.ok) throw new Error(path + " " + res.status);
      return res.json();
    }

    async function loadSession(id, query = "") {
      const sep = query ? (query.startsWith("?") ? query : "?" + query) : "";
      const page = await fetchJSON("/api/sessions/" + encodeURIComponent(id) + sep);
      return {
        id: page.id,
        agent: page.agent,
        title: page.title,
        crumb: page.crumb,
        rows: page.rows,
        older: page.has_older,
        cursor: page.cursor,
        turns: page.turns,
        toolsIndex: page.tools_index || {}
      };
    }

    async function boot() {
      const list = await fetchJSON("/api/sessions");
      sessions = list.map(item => ({
        id: item.id,
        agent: item.agent,
        title: item.title,
        crumb: `${item.agent} · <b>${item.title}</b>`,
        rows: [],
        older: false,
        cursor: 0,
        turns: item.turns,
        toolsIndex: {}
      }));
      paintTabs();
      paintSessions();
      showHome();
    }

    const app = document.getElementById("app");
    const track = document.getElementById("track");
    const lanesEl = document.getElementById("lanes");
    const turnLinesEl = document.getElementById("turnLines");
    const selFill = document.getElementById("selFill");
    const selEdge = document.getElementById("selEdge");
    const hoverLine = document.getElementById("hoverLine");
    const earlierBtn = document.getElementById("earlier");
    const tip = document.getElementById("tip");
    const tbody = document.getElementById("rows");
    const scroller = document.getElementById("scroller");
    const details = document.getElementById("details");
    const resize = document.getElementById("resize");

    let current = { id:"", agent:"", title:"", crumb:"", rows:[], older:false, cursor:0, toolsIndex:{} };
    let agentFilter = null;
    const AGENT_LABELS = { pi: "Pi", cue: "Cue", droid: "Droid", claude: "Claude Code", codex: "Codex" };
    const AGENT_CLASS = { pi: "agent-pi", cue: "agent-cue", droid: "agent-droid", claude: "agent-claude", codex: "agent-codex" };
    let selected = null;
    let follow = true;
    let actualDuration = false;
    let actualTime = false;
    let range = null;
    let draft = null;
    let viewport = null;
    let tab = "summary";
    let tabHistory = ["summary"];
    let tipTimer = 0;
    let unixStarted = false;
    let detailsWidth = null;
    let collapsedTurns = new Set();
    let collapsedAssistants = new Set();
    let loadingOlder = false;
    let searchQuery = "";
    let virtualWindow = { start: 0, end: 40 };

    const laneOf = (kind) => kind === "tool" || kind === "subtool" ? 2 : kind === "assistant" || kind === "compacted" ? 1 : 0;
    const kindLabel = (kind) => ({
      system:"SYSTEM", user:"USER", context:"CONTEXT", compacted:"COMPACTED",
      assistant:"ASSISTANT", tool:"TOOL", subtool:"SUBTOOL"
    }[kind] || String(kind).toUpperCase());
    const timelineMode = () => actualDuration ? (actualTime ? "actual" : "duration") : (actualTime ? "time" : "sequence");
    const byId = (id) => current.rows.find(row => row.id === id);
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[ch]));
    const fmtNum = (value) => value == null ? null : Number(value).toLocaleString("en-US");
    const clock = (ms) => {
      const d = new Date(ms);
      const p = (n, w=2) => String(n).padStart(w, "0");
      return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
    };
    const dayClock = (ms) => {
      const d = new Date(ms);
      const p = (n, w=2) => String(n).padStart(w, "0");
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${clock(ms)}`;
    };
    const durLabel = (ms) => ms < 1000 ? `${Math.round(ms)} ms` : `${(ms/1000).toFixed(ms < 10000 ? 2 : 1)} s`;
    const commaMs = (ms) => `${Math.round(ms).toLocaleString("en-US")} ms`;
    const orderedRange = (a, b) => a <= b ? { start:a, end:b } : { start:b, end:a };
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const centeredRange = (center, width, minimum, maximum) => {
      const clampedWidth = Math.min(maximum - minimum, Math.max(0, width));
      const start = Math.min(Math.max(center - clampedWidth / 2, minimum), maximum - clampedWidth);
      return { start, end: start + clampedWidth };
    };
    const searchBlob = (row) => [
      row.tag, row.kind, row.text, row.extra, row.name, row.result, row.outputText,
      row.payloadText, row.promptText, row.note, row.thinking, row.model, row.effort,
      row.schema && row.schema.name,
      row.schema && row.schema.description, JSON.stringify(row.payload || "")
    ].join(" ").toLowerCase();
    const searchTerms = () => searchQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const rowMatches = (row) => {
      const terms = searchTerms();
      if (!terms.length) return true;
      const blob = searchBlob(row);
      return terms.every(term => blob.includes(term));
    };
    const statusLabel = (status) => status === "failed" ? "Failed" : status === "cancelled" ? "Cancelled" : status === "pending" ? "Pending" : "Completed";
    const modelLabel = (row) => {
      if (!row || !row.model) return "Not present";
      return row.effort ? `${row.model} · ${row.effort}` : row.model;
    };
    const compactPreview = (text) => String(text || "").replace(/\s+/g, " ").trim();
    const rowContent = (row) => {
      if (row.kind === "tool" || row.kind === "subtool") {
        return compactPreview(row.text || row.name || row.tag);
      }
      if (row.text) return compactPreview(row.text);
      if (row.kind !== "assistant") return compactPreview(row.text);
      const names = [];
      for (const item of current.rows) {
        if (item.parentId !== row.id || (item.kind !== "tool" && item.kind !== "subtool")) continue;
        if (item.name && !names.includes(item.name)) names.push(item.name);
      }
      return names.join(" · ");
    };

    function tabsOf(target) {
      if (target.type === "request") return ["summary", "usage", "timing"];
      const row = byId(target.id);
      if (!row) return ["summary"];
      if (row.kind === "system") return row.previousPrompt ? ["diff", "prompt", "tools"] : ["prompt", "tools"];
      if (row.kind === "compacted") return ["summary", "raw"];
      if (row.kind === "tool" || row.kind === "subtool") {
        const tabs = ["summary"];
        if (row.payload || row.payloadText) tabs.push("payload");
        if (row.result || row.resultJson) tabs.push("result");
        tabs.push("schema", "timing");
        return tabs;
      }
      const tabs = ["summary", "preview", "raw"];
      if (row.messageSource) tabs.push("source");
      return tabs;
    }

    function rememberTab(id) {
      tab = id;
      tabHistory = tabHistory.filter(item => item !== id).concat(id);
    }
    function restoreTab(target) {
      const tabs = tabsOf(target);
      const found = [...tabHistory].reverse().find(id => tabs.includes(id));
      tab = found || tabs[0];
    }

    function collapsibleTurns() {
      const counts = new Map();
      for (const row of current.rows) {
        if (row.turn == null || row.kind === "system") continue;
        counts.set(row.turn, (counts.get(row.turn) || 0) + 1);
      }
      return [...counts.entries()].filter(([, n]) => n > 1).map(([turn]) => turn);
    }
    function collapsibleAssistants() {
      const ids = [];
      for (let i = 0; i < current.rows.length; i++) {
        const row = current.rows[i];
        const next = current.rows[i + 1];
        if (row.kind === "assistant" && next && (next.kind === "tool" || next.kind === "subtool")) ids.push(row.id);
      }
      return ids;
    }

    function displayRecords() {
      const terms = searchTerms();
      if (terms.length) return current.rows.filter(rowMatches).map(row => ({ ...row, virtual: "content" }));
      const turnSet = collapsedTurns;
      const out = [];
      const byTurn = new Map();
      for (const row of current.rows) {
        if (row.turn == null) continue;
        const list = byTurn.get(row.turn) || [];
        list.push(row);
        byTurn.set(row.turn, list);
      }
      for (const row of current.rows) {
        if (row.turn == null || !turnSet.has(row.turn) || row.kind === "system") {
          out.push({ ...row, virtual: "content" });
          continue;
        }
        const content = (byTurn.get(row.turn) || []).filter(item => item.kind !== "system");
        if (content.length <= 1 || row.id !== content[0].id) continue;
        out.push({ ...row, virtual: "content" });
        const rest = content.slice(1);
        const steps = new Set(rest.map(item => item.group).filter(group => group && group.startsWith("Step "))).size;
        const tools = rest.filter(item => item.kind === "tool" || item.kind === "subtool").length;
        out.push({
          id: `${row.id}__turn`,
          index: row.index,
          turn: row.turn,
          kind: "summary",
          tag: "SUMMARY",
          virtual: "summary",
          summaryKind: "turn",
          text: `${steps} ${steps === 1 ? "step" : "steps"} · ${tools} tool ${tools === 1 ? "call" : "calls"}`,
          expandTurn: row.turn
        });
      }
      const folded = [];
      for (let i = 0; i < out.length; i++) {
        const row = out[i];
        folded.push(row);
        if (row.kind !== "assistant" || !collapsedAssistants.has(row.id)) continue;
        const calls = [];
        for (let j = i + 1; j < out.length; j++) {
          if (out[j].kind !== "tool" && out[j].kind !== "subtool") break;
          calls.push(out[j]);
        }
        if (!calls.length) continue;
        const names = [...new Set(calls.map(item => item.name).filter(Boolean))];
        folded.push({
          id: `${row.id}__calls`,
          index: row.index,
          turn: row.turn,
          kind: "summary",
          tag: "SUMMARY",
          virtual: "summary",
          summaryKind: "assistant",
          text: `${calls.length} tool ${calls.length === 1 ? "call" : "calls"}${names.length ? ` · ${names.join(", ")}` : ""}`,
          expandAssistant: row.id
        });
        i += calls.length;
      }
      return folded;
    }

    function model() {
      const rows = current.rows.filter(row => row.kind !== "summary");
      const mode = timelineMode();
      if (mode === "sequence") {
        const spans = rows.map((row, i) => ({
          id: row.id, kind: row.kind, lane: laneOf(row.kind), start: i, end: i + 1,
          startedAt: row.startedAt, durationMs: row.durationMs, ttftMs: row.ttftMs,
          error: row.status === "failed"
        }));
        const bounds = [];
        rows.forEach((row, i) => { if (row.start && row.turn) bounds.push({ turn: row.turn, time: i }); });
        return { start: 0, end: Math.max(1, spans.length), spans, bounds };
      }
      const raw = rows.flatMap(row => {
        if (!Number.isFinite(row.startedAt)) return [];
        const durationMs = Math.max(0, row.durationMs || 0);
        return [{
          id: row.id, kind: row.kind, lane: laneOf(row.kind),
          start: row.startedAt, end: row.startedAt + durationMs,
          startedAt: row.startedAt, durationMs, ttftMs: row.ttftMs,
          error: row.status === "failed", turn: row.turn, turnStart: row.start
        }];
      });
      if (!raw.length) return null;
      const compressIdle = mode === "duration";
      const useWidth = mode === "actual" || mode === "duration";
      const removed = new Map();
      let idle = 0;
      let covered = null;
      for (const span of [...raw].sort((a, b) => a.start - b.start || a.end - b.end)) {
        if (compressIdle && covered != null && span.start > covered) idle += span.start - covered;
        removed.set(span.id, idle);
        covered = covered == null ? span.end : Math.max(covered, span.end);
      }
      const spans = raw.map(span => {
        const offset = removed.get(span.id) || 0;
        return {
          ...span,
          start: span.start - offset,
          end: (useWidth ? span.end : span.start) - offset
        };
      });
      const bounds = [];
      const seen = new Set();
      for (const span of spans) {
        if (!span.turnStart || !span.turn || seen.has(span.turn)) continue;
        seen.add(span.turn);
        const first = Math.min(...spans.filter(item => item.turn === span.turn).map(item => item.start));
        bounds.push({ turn: span.turn, time: first });
      }
      return {
        start: Math.min(...spans.map(s => s.start)),
        end: Math.max(...spans.map(s => s.end)),
        spans, bounds
      };
    }

    function domainState(m) {
      const fullDuration = Math.max(1, m.end - m.start);
      if (!viewport) return { domainStart: m.start, domainDuration: fullDuration, fullDuration };
      const viewportDuration = Math.min(fullDuration, Math.max(1, viewport.end - viewport.start));
      const domainStart = clamp(viewport.start, m.start, m.end - viewportDuration);
      return { domainStart, domainDuration: viewportDuration, fullDuration };
    }

    function focusSet() {
      const m = model();
      const sel = draft || range;
      if (!m || !sel) return null;
      return new Set(m.spans.filter(s => s.start <= sel.end && s.end >= sel.start).map(s => s.id));
    }

    function paintTabs() {
      const agents = [];
      for (const s of sessions) if (!agents.includes(s.agent)) agents.push(s.agent);
      const el = document.getElementById("sessTabs");
      const tab = (key, label) => {
        const cls = key ? (AGENT_CLASS[key] || "") : "";
        const dot = key ? `<i class="dot"></i>` : "";
        return `<button type="button" class="tab ${cls}" data-agent="${key}" aria-pressed="${(agentFilter ?? "") === key}">${dot}${esc(label)}</button>`;
      };
      el.innerHTML = tab("", "全部") + agents.map(a => tab(a, AGENT_LABELS[a] || a)).join("");
      el.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
        agentFilter = btn.dataset.agent || null;
        paintTabs();
        paintSessions();
      }));
    }

    function paintSessions() {
      const visible = agentFilter ? sessions.filter(session => session.agent === agentFilter) : sessions;
      document.getElementById("sessList").innerHTML = visible.map(session => `
        <button class="item ${AGENT_CLASS[session.agent] || ""}" type="button" data-sid="${session.id}" aria-current="${session.id === current.id}">
          <span class="t">${esc(session.title)}</span>
          <small class="agent">${esc(AGENT_LABELS[session.agent] || session.agent)}</small>
          <small>${session.turns ?? session.rows.filter(row => row.start).length} turns</small>
        </button>`).join("");
      document.querySelectorAll(".item").forEach(btn => btn.addEventListener("click", () => openSession(btn.dataset.sid)));
    }

    function showHome() {
      current = { id:"", agent:"", title:"", crumb:"", rows:[], older:false, cursor:0, toolsIndex:{} };
      selected = null;
      range = null;
      draft = null;
      viewport = null;
      agentFilter = null;
      searchQuery = "";
      document.getElementById("q").value = "";
      const empty = sessions.length ? "选择一条会话" : "no sessions";
      document.getElementById("crumb").textContent = empty;
      document.getElementById("homeEmpty").textContent = empty;
      app.dataset.home = "true";
      app.dataset.inspect = "";
      paintTabs();
      paintSessions();
    }

    function paintOverview() {
      const m = model();
      const chip = document.getElementById("modeChip");
      chip.textContent = timelineMode();
      if (!m) return;
      const { domainStart, domainDuration, fullDuration } = domainState(m);
      const left = `${-((domainStart - m.start) / domainDuration) * 100}%`;
      const width = `${(fullDuration / domainDuration) * 100}%`;
      turnLinesEl.style.setProperty("--domain-left", left);
      turnLinesEl.style.setProperty("--domain-width", width);
      lanesEl.style.setProperty("--domain-left", left);
      lanesEl.style.setProperty("--domain-width", width);
      const sel = draft || range;
      const matches = searchTerms().length ? new Set(current.rows.filter(rowMatches).map(row => row.id)) : null;
      const equal = timelineMode() === "time";
      turnLinesEl.innerHTML = m.bounds.map(b =>
        `<span class="turn-line" style="--left:${((b.time - m.start) / fullDuration) * 100}%"></span>`
      ).join("");
      lanesEl.innerHTML = m.spans.map(span => {
        const spanLeft = ((span.start - m.start) / fullDuration) * 100;
        const spanWidth = ((span.end - span.start) / fullDuration) * 100;
        const inRange = !sel || (span.start <= sel.end && span.end >= sel.start);
        const search = !matches || matches.has(span.id);
        const ttft = span.ttftMs && span.durationMs ? `${(span.ttftMs / span.durationMs) * 100}%` : "";
        const currentSel = selected && selected.type === "record" && span.id === selected.id;
        return `<span class="span ${span.kind}"
          data-id="${span.id}" data-current="${currentSel}" data-in-range="${inRange}"
          data-search="${search}" data-error="${span.error === true}" data-equal="${equal}"
          ${ttft ? `data-ttft="true"` : ""}
          style="--lane:${span.lane};--left:${spanLeft}%;--width:${spanWidth}%;--gap:min(${Math.max(spanWidth, 0.01) * 0.08}%,1px);${ttft ? `--ttft:${ttft};` : ""}"></span>`;
      }).join("");
      if (sel) {
        const s = clamp(Math.min(sel.start, sel.end), m.start, m.end);
        const e = clamp(Math.max(sel.start, sel.end), m.start, m.end);
        const selLeft = ((s - domainStart) / domainDuration) * 100;
        const selWidth = ((e - s) / domainDuration) * 100;
        selFill.hidden = false; selEdge.hidden = false;
        selFill.dataset.draft = draft ? "true" : "false";
        selEdge.dataset.draft = draft ? "true" : "false";
        [selFill, selEdge].forEach(el => {
          el.style.setProperty("--sel-left", `${selLeft}%`);
          el.style.setProperty("--sel-width", `${Math.max(selWidth, 0.15)}%`);
        });
      } else {
        selFill.hidden = true; selEdge.hidden = true;
      }
      const atStart = !viewport || domainStart === m.start;
      earlierBtn.hidden = !(current.older && atStart);
      earlierBtn.disabled = loadingOlder;
    }

    function virtualRows(records) {
      const force = current.older === true;
      if (records.length <= VIRTUAL_THRESHOLD && !force) {
        return { virtual: false, rows: records, top: 0, bottom: 0, total: records.length * CONTENT_ROW_HEIGHT };
      }
      const items = records.map(row => ({
        row,
        height: row.virtual === "summary" ? COLLAPSED_SUMMARY_HEIGHT : CONTENT_ROW_HEIGHT
      }));
      const olderH = current.older ? CONTENT_ROW_HEIGHT : 0;
      let offset = olderH;
      const offsets = items.map(item => {
        const start = offset;
        offset += item.height;
        return { ...item, start, end: offset };
      });
      const viewH = scroller.clientHeight || 600;
      const top = scroller.scrollTop;
      let first = offsets.findIndex(item => item.end >= top);
      if (first < 0) first = 0;
      let last = offsets.findIndex(item => item.start > top + viewH);
      if (last < 0) last = offsets.length;
      first = Math.max(0, first - OVERSCAN);
      last = Math.min(offsets.length, last + OVERSCAN);
      const shown = offsets.slice(first, last);
      const topSpacer = Math.max(0, (shown[0]?.start || olderH) - olderH);
      const lastEnd = shown.length ? shown[shown.length - 1].end : olderH;
      return {
        virtual: true,
        rows: shown.map(item => item.row),
        top: topSpacer,
        bottom: Math.max(0, offset - lastEnd),
        total: offset
      };
    }

    function paintTable() {
      const records = displayRecords();
      const focus = focusSet();
      const pack = virtualRows(records);
      const parts = [];
      if (current.older) {
        parts.push(`<tr class="older" data-kind="older"><td class="idx"></td><td colspan="2"><button class="ghost" id="loadOlder" ${loadingOlder ? "disabled" : ""}>${loadingOlder ? "Loading…" : "Load earlier history"}</button></td></tr>`);
      }
      if (pack.virtual && pack.top) parts.push(`<tr class="spacer"><td colspan="3" style="--h:${pack.top}px;height:${pack.top}px"></td></tr>`);
      for (const row of pack.rows) {
        if (row.kind === "summary") {
          parts.push(`<tr class="summary" data-kind="summary" data-expand-turn="${row.expandTurn || ""}" data-expand-assistant="${row.expandAssistant || ""}">
            <td class="idx"></td><td class="evt"></td><td>${esc(row.text)}</td></tr>`);
          continue;
        }
        const out = focus && !focus.has(row.id);
        const selectedRow = selected.type === "record" && selected.id === row.id;
        const idx = String(row.index + 1).padStart(2, "0");
        const reqActive = selected.type === "request" && selected.id === row.id;
        const req = row.requestNo
          ? `<button class="req-dot" data-req="${row.id}" data-error="${row.status === "failed" || row.status === "cancelled"}" data-active="${reqActive}" title="Request #${row.requestNo}"><span>Request #${row.requestNo}</span></button>`
          : "";
        const turn = row.start && row.turn && row.kind !== "context"
          ? `<span class="turn-chip">${row.turn < 0 ? "T…" : `T${row.turn}`}</span>`
          : "";
        const content = rowContent(row);
        parts.push(`<tr data-id="${row.id}" data-selected="${selectedRow}" data-focus="${out ? "out" : "in"}" data-error="${row.status === "failed" || row.status === "cancelled"}" data-pending="${row.status === "pending"}" ${row.start ? 'data-turn-start="true"' : ""} class="${row.kind === "subtool" ? "subtool" : ""}">
          <td class="idx">${idx}${turn}</td>
          <td class="evt">${req}<span class="kind ${row.kind}">${esc(row.tag)}</span></td>
          <td class="content ${row.kind === "tool" || row.kind === "subtool" ? "mono" : ""}">${esc(content)}</td>
        </tr>`);
      }
      if (pack.virtual && pack.bottom) parts.push(`<tr class="spacer"><td colspan="3" style="--h:${pack.bottom}px;height:${pack.bottom}px"></td></tr>`);
      tbody.innerHTML = parts.join("");
      tbody.querySelectorAll("tr[data-id]").forEach(tr => {
        tr.addEventListener("click", () => selectRecord(tr.dataset.id, { fromTable: true }));
        tr.addEventListener("dblclick", (event) => {
          const row = byId(tr.dataset.id);
          if (!row) return;
          event.preventDefault();
          if (row.kind === "assistant" && collapsibleAssistants().includes(row.id)) toggleAssistant(row.id);
          else if (row.start && collapsibleTurns().includes(row.turn)) toggleTurn(row.turn);
        });
      });
      tbody.querySelectorAll("tr.summary").forEach(tr => {
        tr.addEventListener("click", () => {
          if (tr.dataset.expandTurn) { collapsedTurns.delete(Number(tr.dataset.expandTurn)); paint(); }
          if (tr.dataset.expandAssistant) { collapsedAssistants.delete(tr.dataset.expandAssistant); paint(); }
        });
      });
      tbody.querySelectorAll("[data-req]").forEach(btn => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          selectRequest(btn.dataset.req);
        });
      });
      const loadBtn = document.getElementById("loadOlder");
      if (loadBtn) loadBtn.addEventListener("click", () => loadOlder());
      paintFoldButtons();
    }

    function paintFoldButtons() {
      const turns = collapsibleTurns();
      const calls = collapsibleAssistants();
      const allTurns = turns.length > 0 && turns.every(turn => collapsedTurns.has(turn));
      const allCalls = calls.length > 0 && calls.every(id => collapsedAssistants.has(id));
      const turnsBtn = document.getElementById("turnsBtn");
      const callsBtn = document.getElementById("callsBtn");
      turnsBtn.setAttribute("aria-pressed", allTurns);
      callsBtn.setAttribute("aria-pressed", allCalls);
      turnsBtn.title = allTurns ? "Expand turns" : "Collapse turns";
      callsBtn.title = allCalls ? "Expand calls" : "Collapse calls";
      turnsBtn.querySelector(".ico").textContent = allTurns ? "⊞" : "⊟";
      callsBtn.querySelector(".ico").textContent = allCalls ? "⊞" : "⊟";
    }

    function jsonTree(value, key) {
      if (value && typeof value === "object") {
        const entries = Array.isArray(value)
          ? value.map((item, i) => jsonTree(item, String(i)))
          : Object.entries(value).map(([k, v]) => jsonTree(v, k));
        const label = key == null ? (Array.isArray(value) ? `array[${value.length}]` : "object") : esc(key);
        return `<details open><summary><span class="k">${label}</span></summary>${entries.join("")}</details>`;
      }
      const shown = typeof value === "string" ? `"${esc(value)}"` : esc(value);
      const cls = typeof value === "string" ? "s" : "n";
      return `<div>${key != null ? `<span class="k">${esc(key)}</span>: ` : ""}<span class="${cls}">${shown}</span></div>`;
    }
    if (window.marked) {
      // 语料是本地会话文本，不构成高信任边界：原始 HTML 一律转义成文本，
      // 链接只放行 http(s) 协议。表格/换行走 GFM（marked 默认 gfm 开启）。
      marked.use({
        gfm: true,
        breaks: true,
        renderer: {
          html(token) { return esc(token.raw); },
          link(token) {
            const href = token.href || "";
            if (!/^(https?:)?\/\//i.test(href) && !/^mailto:/i.test(href)) return esc(token.text);
            return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(token.text)}</a>`;
          }
        }
      });
    }
    function markdown(text) {
      const source = text ?? "";
      let html;
      try {
        html = window.marked ? marked.parse(source) : esc(source).replace(/\n/g, "<br>");
      } catch (err) {
        html = esc(source).replace(/\n/g, "<br>");
      }
      return `<div class="md">${html}</div>`;
    }
    function highlightMd() {
      if (!window.hljs) return;
      document.querySelectorAll(".md pre code").forEach(el => {
        if (el.dataset.highlighted) return;
        try { hljs.highlightElement(el); } catch (err) { /* 保留纯文本 */ }
        el.dataset.highlighted = "1";
      });
    }
    const fmtCost = (value) => value == null ? null : (Math.abs(value) < 0.01 ? Number(value).toPrecision(3) : fmtNum(value));
    function usageCells(usage) {
      const cell = (label, value, status) => {
        const miss = status === "n/a" || status === "missing" || value == null;
        return `<div class="u-cell"><span>${label}</span>${miss ? `<b class="miss">${status === "n/a" ? "—" : "Missing"}</b>` : `<b>${value}</b>`}</div>`;
      };
      const status = usage.status;
      const st = (value) => status === "n/a" ? "n/a" : value == null ? "missing" : status;
      return `<div class="usage-grid">
        ${cell("Input", fmtNum(usage.input), st(usage.input))}
        ${cell("Output", fmtNum(usage.output), st(usage.output))}
        ${cell("Cache read", fmtNum(usage.cacheRead), st(usage.cacheRead))}
        ${cell("Cache write", fmtNum(usage.cacheWrite), st(usage.cacheWrite))}
        ${cell("Total tokens", fmtNum(usage.totalTokens), st(usage.totalTokens))}
        ${cell("Cost", fmtCost(usage.cost), st(usage.cost))}
      </div>`;
    }
    function sessionUsage() {
      // Session cumulative：按已加载窗口内所有 reported 的 assistant 行累计
      // （与 dsh 的窗口投影同思路：只统计前端已到手的数据）。
      const total = { input: 0, output: 0, cacheRead: 0, cacheWrite: 0, totalTokens: 0, cost: 0 };
      let count = 0;
      for (const row of current.rows) {
        const u = row.usage;
        if (row.kind !== "assistant" || !u || u.status !== "reported") continue;
        count += 1;
        for (const key of ["input", "output", "cacheRead", "cacheWrite", "totalTokens", "cost"]) {
          if (typeof u[key] === "number") total[key] += u[key];
        }
      }
      if (!count) return null;
      return { usage: { ...total, status: "reported" }, count };
    }
    function section(label, tabId, inner) {
      return `<div class="sec"><button class="sec-h" type="button" data-open="${tabId}">${label} <span>›</span></button>${inner}</div>`;
    }
    function thinkingBlock(text) {
      if (!text) return "";
      return `<details class="think"><summary>Thinking</summary><div class="think-body">${markdown(text)}</div></details>`;
    }
    function previewBody(row) {
      const output = row.kind === "assistant"
        ? (row.outputText || "")
        : (row.payloadText || row.outputText || row.text || "");
      const html = thinkingBlock(row.thinking) + (output ? markdown(output) : "");
      return html || `<p class="miss">No content</p>`;
    }
    function tokenRows(row) {
      const usage = row.usage || {};
      const output = usage.output;
      const think = usage.reasoning;
      const content = output != null && think != null ? Math.max(0, output - think) : null;
      return `<div><dt>Tokens</dt><dd>${output == null ? "—" : `${fmtNum(output)} tok`}</dd></div>`
        + (think != null ? `<div><dt>Reasoning</dt><dd>${fmtNum(think)} tok</dd></div>` : "")
        + (content != null ? `<div><dt>Content</dt><dd>${fmtNum(content)} tok</dd></div>` : "");
    }
    function startedButton(ms) {
      if (!Number.isFinite(ms)) return `<dd>Not available</dd>`;
      const label = unixStarted ? (ms / 1000).toFixed(3) : dayClock(ms);
      return `<dd><button class="stamp" id="startedBtn" type="button" title="${unixStarted ? "Show local time" : "Show Unix timestamp"}">${label}</button></dd>`;
    }
    function unifiedDiff(before, after) {
      if (before === after) return `<pre class="blob miss">No prompt change</pre>`;
      return `<pre class="blob diff"><span class="del">- ${esc(before)}</span>\n<span class="add">+ ${esc(after)}</span></pre>`;
    }

    function paintInspector() {
      if (!selected) { app.dataset.inspect = ""; return; }
      app.dataset.inspect = "open";
      if (detailsWidth != null) details.style.width = `${detailsWidth}px`;
      else details.style.width = "";
      const tabs = tabsOf(selected);
      if (!tabs.includes(tab)) tab = tabs[0];
      const tag = document.getElementById("dTag");
      const loc = document.getElementById("dLoc");
      const body = document.getElementById("dBody");
      if (selected.type === "request") {
        const row = byId(selected.id);
        tag.className = "kind request";
        tag.innerHTML = `<span class="req-chip-dot"></span>Request #${row.requestNo}`;
        loc.textContent = row.turn == null ? "SYSTEM" : `Turn ${row.turn} · ${row.group || "Step"}`;
        document.getElementById("tabs").innerHTML = tabs.map(id =>
          `<button class="tab" type="button" data-tab="${id}" aria-selected="${id === tab}">${id[0].toUpperCase() + id.slice(1)}</button>`
        ).join("");
        const siblings = current.rows.filter(item => item.requestNo === row.requestNo || item.parentId === row.id || (item.group === row.group && item.turn === row.turn));
        const tools = siblings.filter(item => item.kind === "tool").length;
        const subs = siblings.filter(item => item.kind === "subtool").length;
        if (tab === "summary") {
          body.innerHTML = `<dl class="kv">
            <div><dt>Status</dt><dd>${statusLabel(row.status)}</dd></div>
            <div><dt>Provider</dt><dd>${esc(current.agent || "Not present")}</dd></div>
            <div><dt>Model</dt><dd>${esc(modelLabel(row))}</dd></div>
            <div><dt>Tool calls</dt><dd>${tools}</dd></div>
            <div><dt>Subtool calls</dt><dd>${subs}</dd></div>
            <div><dt>Result</dt><dd><button class="jump" type="button" data-jump="${row.id}">Assistant Message <i>›</i></button></dd></div>
          </dl>`;
        } else if (tab === "usage") {
          const cum = sessionUsage();
          body.innerHTML = `<div class="sec"><div class="sec-h">This request</div>${usageCells(row.usage)}</div>
            <div class="sec"><div class="sec-h">Session cumulative${cum ? ` · ${cum.count} request${cum.count > 1 ? "s" : ""}` : ""}</div>${cum ? usageCells(cum.usage) : `<p class="miss">No reported usage in loaded window.</p>`}</div>`;
        } else {
          body.innerHTML = `<dl class="kv">
            <div><dt>Started</dt>${startedButton(row.startedAt)}</div>
            <div><dt>Duration</dt><dd>${durLabel(row.durationMs)}</dd></div>
            ${row.ttftMs != null ? `<div><dt>TTFT</dt><dd>${durLabel(row.ttftMs)}</dd></div>` : ""}
            ${row.decodingMs != null ? `<div><dt>Generation</dt><dd>${durLabel(row.decodingMs)}</dd></div>` : ""}
            ${row.outputTokens && row.decodingMs ? `<div><dt>Throughput</dt><dd>${(row.outputTokens / (row.decodingMs / 1000)).toFixed(1)} tok/s</dd></div>` : ""}
          </dl>`;
        }
      } else {
        const row = byId(selected.id);
        if (!row) { app.dataset.inspect = ""; return; }
        tag.className = `kind ${row.kind}`;
        tag.textContent = row.tag;
        loc.textContent = row.turn == null ? "SYSTEM" : `Turn ${row.turn} · Step ${row.step}`;
        document.getElementById("tabs").innerHTML = tabs.map(id => {
          const label = { summary:"Summary", payload:"Payload", result:"Result", schema:"Schema", timing:"Timing", preview:"Preview", raw:"Raw", source:"Source", prompt:"System Prompt", tools:"Tools", diff:"Diff" }[id] || id;
          return `<button class="tab" type="button" data-tab="${id}" aria-selected="${id === tab}">${label}</button>`;
        }).join("");
        const parent = row.parentId ? byId(row.parentId) : null;
        const grand = parent && parent.parentId ? byId(parent.parentId) : null;
        if (row.kind === "system") {
          if (tab === "prompt") body.innerHTML = `<div class="sec">${markdown(row.promptText || "")}</div>`;
          else if (tab === "tools") body.innerHTML = (row.toolsCatalog || []).map(tool =>
            `<details class="tool-card"><summary>${esc(tool.name)}</summary><div class="inner"><p class="miss">${esc(tool.description)}</p><div class="tree">${jsonTree(tool.parameters)}</div></div></details>`
          ).join("");
          else body.innerHTML = `<div class="sec">${unifiedDiff(row.previousPrompt || "", row.promptText || "")}</div>`;
        } else if (row.kind === "compacted") {
          if (tab === "raw") {
            body.innerHTML = `<div class="sec"><pre class="blob">${esc(row.outputText || row.text || "No output")}</pre></div>`;
          } else {
            body.innerHTML = `<dl class="kv">
              <div><dt>Status</dt><dd>${statusLabel(row.status)}</dd></div>
              ${row.note ? `<div><dt>Note</dt><dd>${esc(row.note)}</dd></div>` : ""}
              <div><dt>Summary</dt><dd>${esc(row.text || "Context compacted")}</dd></div>
            </dl>`;
          }
        } else if (tab === "summary") {
          const toolSchema = row.schema || (current.toolsIndex && current.toolsIndex[row.name]);
          const isMarkdown = row.kind === "assistant" || row.kind === "user" || row.kind === "context";
          body.innerHTML = `
            <dl class="kv">
              ${parent ? `<div><dt>Hierarchy</dt><dd><button class="jump" type="button" data-jump="${parent.id}">${parent.kind === "assistant" ? "Assistant Message" : parent.tag} <i>›</i></button>${grand ? ` · <button class="jump" type="button" data-jump="${grand.id}">${grand.tag} <i>›</i></button>` : ""}</dd></div>` : ""}
              <div><dt>Status</dt><dd>${statusLabel(row.status)}</dd></div>
              ${row.kind === "assistant" && row.model ? `<div><dt>Model</dt><dd>${esc(modelLabel(row))}</dd></div>` : ""}
              ${row.kind === "assistant" ? tokenRows(row) : ""}
              ${(row.kind === "user" || row.kind === "context") ? `<div><dt>Duration</dt><dd>${durLabel(row.durationMs || 0)}</dd></div>` : ""}
              ${row.note ? `<div><dt>Note</dt><dd>${esc(row.note)}</dd></div>` : ""}
            </dl>
            ${isMarkdown ? section("Preview", "preview", previewBody(row)) : ""}
            ${!isMarkdown && row.payload ? section("Payload", "payload", `<div class="tree">${jsonTree(row.payload)}</div>`) : ""}
            ${!isMarkdown && row.result ? section("Result", "result", `<pre class="blob">${esc(row.result)}</pre>`) : ""}
            ${!isMarkdown && toolSchema ? section("Schema", "schema", `<div class="schema-box"><h3>${esc(toolSchema.name)}</h3>${toolSchema.description ? `<p>${esc(toolSchema.description)}</p>` : ""}</div>`) : ""}
            ${section(row.kind === "assistant" ? "Request Timing" : "Timing", "timing", `<dl class="kv">
              <div><dt>Started</dt>${startedButton(row.startedAt)}</div>
              <div><dt>Duration</dt><dd>${durLabel(row.durationMs || 0)}</dd></div>
              <div><dt>Timing source</dt><dd>Session timestamps</dd></div>
            </dl>`)}`;
        } else if (tab === "payload") {
          body.innerHTML = row.payload
            ? `<div class="sec"><div class="tree">${jsonTree(row.payload)}</div></div>`
            : row.payloadText ? `<div class="sec">${markdown(row.payloadText)}</div>`
            : `<div class="sec miss">No payload captured</div>`;
        } else if (tab === "result") {
          body.innerHTML = row.result
            ? `<div class="sec"><pre class="blob">${esc(row.result)}</pre></div>`
            : `<div class="sec miss">No result captured</div>`;
        } else if (tab === "schema") {
          const toolSchema = row.schema || (current.toolsIndex && current.toolsIndex[row.name]);
          const params = toolSchema && toolSchema.parameters && typeof toolSchema.parameters === "object" && Object.keys(toolSchema.parameters).length ? toolSchema.parameters : null;
          body.innerHTML = toolSchema
            ? `<div class="sec"><div class="schema-box"><h3>${esc(toolSchema.name)}</h3>${toolSchema.description ? `<p>${esc(toolSchema.description)}</p>` : ""}</div>${params ? `<div class="tree">${jsonTree(params)}</div>` : `<p class="miss" style="margin-top:6px">Parameters not recorded in source log</p>`}</div>`
            : `<div class="sec miss">Schema unavailable</div>`;
        } else if (tab === "timing") {
          const throughput = row.outputTokens && row.decodingMs
            ? `${(row.outputTokens / (row.decodingMs / 1000)).toFixed(1)} tok/s`
            : null;
          body.innerHTML = `<dl class="kv">
            <div><dt>Started</dt>${startedButton(row.startedAt)}</div>
            <div><dt>Duration</dt><dd>${row.durationMs ? durLabel(row.durationMs) : "Pending"}</dd></div>
            <div><dt>TTFT</dt><dd>${row.ttftMs != null ? durLabel(row.ttftMs) : "First token unavailable"}</dd></div>
            <div><dt>Generation</dt><dd>${row.decodingMs != null ? durLabel(row.decodingMs) : "Not recorded"}</dd></div>
            ${throughput ? `<div><dt>Throughput</dt><dd>${throughput}</dd></div>` : `<div><dt>Throughput</dt><dd class="miss">Usage unavailable</dd></div>`}
            <div><dt>Timing source</dt><dd>Session timestamps</dd></div>
          </dl>`;
        } else if (tab === "preview") {
          body.innerHTML = `<div class="sec">${previewBody(row)}</div>`;
        } else if (tab === "raw" || tab === "source") {
          const raw = [row.thinking, row.outputText || row.payloadText || row.text].filter(Boolean).join("\n\n");
          body.innerHTML = `<div class="sec"><pre class="blob">${esc(raw || "No content")}</pre></div>`;
        }
      }
      document.querySelectorAll("#tabs .tab").forEach(btn => btn.addEventListener("click", () => { rememberTab(btn.dataset.tab); paintInspector(); }));
      body.querySelectorAll("[data-open]").forEach(btn => btn.addEventListener("click", () => { rememberTab(btn.dataset.open); paintInspector(); }));
      body.querySelectorAll("[data-jump]").forEach(btn => btn.addEventListener("click", () => selectRecord(btn.dataset.jump)));
      body.querySelectorAll("[data-open-req]").forEach(btn => btn.addEventListener("click", () => selectRequest(btn.dataset.openReq)));
      const startedBtn = document.getElementById("startedBtn");
      if (startedBtn) startedBtn.addEventListener("click", (event) => {
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.rangeCount && sel.getRangeAt(0).intersectsNode(event.currentTarget)) return;
        unixStarted = !unixStarted;
        paintInspector();
      });
      highlightMd();
    }

    function paint() {
      suppressOlder = true;
      paintOverview();
      paintTable();
      paintInspector();
      requestAnimationFrame(() => {
        lastScrollTop = scroller.scrollTop;
        suppressOlder = false;
      });
    }

    function selectRecord(id, opts = {}) {
      const row = byId(id);
      if (!row) return;
      const focus = focusSet();
      if (opts.fromTable && focus && !focus.has(id)) range = null;
      selected = { type: "record", id };
      if (opts.clearRange) range = null;
      restoreTab(selected);
      paint();
      const tr = tbody.querySelector(`tr[data-id="${id}"]`);
      if (tr) tr.scrollIntoView({ block: "nearest" });
    }
    function selectRequest(id) {
      selected = { type: "request", id };
      restoreTab(selected);
      paint();
    }
    function focusRecord(id) {
      const tr = tbody.querySelector(`tr[data-id="${id}"]`);
      if (tr) tr.scrollIntoView({ block: "nearest" });
    }

    function toggleTurn(turn) {
      if (collapsedTurns.has(turn)) collapsedTurns.delete(turn);
      else collapsedTurns.add(turn);
      paint();
    }
    function toggleAssistant(id) {
      if (collapsedAssistants.has(id)) collapsedAssistants.delete(id);
      else collapsedAssistants.add(id);
      paint();
    }

    async function openSession(id) {
      const next = await loadSession(id);
      if (!next) return;
      const idx = sessions.findIndex(session => session.id === next.id);
      if (idx >= 0) sessions[idx] = next; else sessions.push(next);
      current = next;
      selected = next.rows.length ? { type: "record", id: next.rows[next.rows.length - 1].id } : null;
      range = null;
      draft = null;
      viewport = null;
      tab = "summary";
      tabHistory = ["summary"];
      collapsedTurns = new Set();
      collapsedAssistants = new Set();
      searchQuery = "";
      document.getElementById("q").value = "";
      document.getElementById("crumb").innerHTML = next.crumb;
      app.dataset.home = "";
      paintSessions();
      paint();
      requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; });
    }

    async function loadOlder() {
      if (loadingOlder || !current.older) return;
      loadingOlder = true;
      paint();
      const prevHeight = scroller.scrollHeight;
      const prevTop = scroller.scrollTop;
      const page = await loadSession(current.id, `?before=${current.cursor}&limit=36`);
      const have = new Set(current.rows.map(r => r.id));
      const prepend = page.rows.filter(r => !have.has(r.id)).map(r => ({ ...r, _keptOlder: true }));
      current.rows = [...prepend, ...current.rows].map((row, i) => ({ ...row, index: i }));
      current.older = page.older;
      current.cursor = page.cursor;
      loadingOlder = false;
      paint();
      scroller.scrollTop = prevTop + (scroller.scrollHeight - prevHeight);
    }

    function fractionAt(event) {
      const rect = track.getBoundingClientRect();
      return clamp((event.clientX - rect.left) / Math.max(1, rect.width), 0, 1);
    }
    function spanIdAt(event) {
      const node = event.target.closest?.("[data-id]");
      return node ? node.dataset.id : null;
    }

    let drag = null;
    let pan = null;

    track.addEventListener("pointerdown", (event) => {
      const m = model();
      if (!m) return;
      const { domainStart, domainDuration } = domainState(m);
      if (event.button === 2) {
        pan = {
          pointerId: event.pointerId,
          anchorClientX: event.clientX,
          anchorStart: domainStart,
          moved: false,
          pannable: viewport != null
        };
        track.dataset.panning = viewport ? "true" : "false";
        track.setPointerCapture(event.pointerId);
        return;
      }
      if (event.button !== 0) return;
      const t = domainStart + fractionAt(event) * domainDuration;
      drag = { pointerId: event.pointerId, x: event.clientX, t, id: spanIdAt(event) };
      draft = { start: t, end: t };
      track.setPointerCapture(event.pointerId);
      paintOverview();
    });
    track.addEventListener("pointermove", (event) => {
      const m = model();
      if (!m) return;
      const frac = fractionAt(event);
      const id = spanIdAt(event);
      if (pan && pan.pointerId === event.pointerId) {
        if (Math.abs(event.clientX - pan.anchorClientX) >= MINIMUM_DRAG_PX) pan.moved = true;
        if (!pan.pannable) return;
        const { domainDuration, fullDuration } = domainState(m);
        const delta = (event.clientX - pan.anchorClientX) / Math.max(1, track.getBoundingClientRect().width);
        const nextStart = clamp(pan.anchorStart - delta * domainDuration, m.start, m.end - domainDuration);
        viewport = { start: nextStart, end: nextStart + domainDuration };
        if (domainDuration >= fullDuration * 0.999) viewport = null;
        paintOverview();
        return;
      }
      if (!drag) {
        hoverLine.hidden = id !== null;
        hoverLine.style.setProperty("--hover-left", `${frac * 100}%`);
        lanesEl.querySelectorAll(".span").forEach(el => { el.dataset.hovered = el.dataset.id === id; });
        window.clearTimeout(tipTimer);
        if (id == null) { tip.dataset.on = "false"; return; }
        tipTimer = window.setTimeout(() => {
          const row = byId(id);
          const node = lanesEl.querySelector(`.span[data-id="${id}"]`);
          if (!row || !node) return;
          const box = node.getBoundingClientRect();
          const lines = [kindLabel(row.kind)];
          if (Number.isFinite(row.startedAt) && row.durationMs) {
            lines.push(`${clock(row.startedAt)} → ${clock(row.startedAt + row.durationMs)}`);
          } else if (Number.isFinite(row.startedAt)) {
            lines.push(`Started ${clock(row.startedAt)}`);
          }
          const bits = [];
          if (row.durationMs) bits.push(`Total ${commaMs(row.durationMs)}`);
          if (row.ttftMs != null && row.decodingMs != null) bits.push(`TTFT ${commaMs(row.ttftMs)} · Decoding ${commaMs(row.decodingMs)}`);
          if (bits.length) lines.push(bits.join(" · "));
          tip.textContent = lines.join("\n");
          tip.style.left = `${Math.min(window.innerWidth - 220, Math.max(12, box.left + box.width / 2 - 80))}px`;
          tip.style.top = `${box.bottom + 8}px`;
          tip.dataset.on = "true";
        }, TIMELINE_TOOLTIP_DELAY_MS);
        return;
      }
      const rect = track.getBoundingClientRect();
      let { domainStart, domainDuration } = domainState(m);
      if (viewport) {
        const localX = event.clientX - rect.left;
        const edgeWidth = Math.min(MAXIMUM_EDGE_PAN_PX, Math.max(1, rect.width * EDGE_PAN_ZONE_FRACTION));
        const direction = localX < edgeWidth ? -1 : localX > rect.width - edgeWidth ? 1 : 0;
        if (direction !== 0) {
          const edgeDistance = direction < 0 ? edgeWidth - localX : localX - (rect.width - edgeWidth);
          const strength = clamp(edgeDistance / edgeWidth, 0, 1);
          const nextStart = clamp(
            domainStart + direction * domainDuration * EDGE_PAN_STEP_FRACTION * Math.max(0.2, strength),
            m.start,
            m.end - domainDuration
          );
          viewport = { start: nextStart, end: nextStart + domainDuration };
          domainStart = nextStart;
        }
      }
      const next = domainStart + frac * domainDuration;
      draft = orderedRange(drag.t, next);
      paintOverview();
    });
    track.addEventListener("pointerup", (event) => {
      if (pan && pan.pointerId === event.pointerId) {
        const moved = pan.moved || Math.abs(event.clientX - pan.anchorClientX) >= MINIMUM_DRAG_PX;
        pan = null;
        track.dataset.panning = "false";
        if (!moved) { range = null; draft = null; paint(); }
        return;
      }
      if (!drag || drag.pointerId !== event.pointerId) return;
      const m = model();
      const { domainStart, domainDuration } = domainState(m);
      const moved = Math.abs(event.clientX - drag.x) >= MINIMUM_DRAG_PX;
      const clickId = spanIdAt(event) || drag.id;
      if (!moved && clickId) {
        range = null;
        draft = null;
        selectRecord(clickId, { clearRange: true });
      } else {
        const selectedRange = draft || orderedRange(drag.t, domainStart + fractionAt(event) * domainDuration);
        const minW = Math.min(domainDuration, (m.end - m.start) / Math.max(m.spans.length, 1));
        range = selectedRange.end - selectedRange.start < minW
          ? centeredRange(moved ? (selectedRange.start + selectedRange.end) / 2 : selectedRange.start, minW, m.start, m.end)
          : selectedRange;
        draft = null;
        if (!moved) {
          const t = selectedRange.start;
          const nearest = m.spans.reduce((best, span) => {
            const dist = t < span.start ? span.start - t : t > span.end ? t - span.end : 0;
            const bestDist = t < best.start ? best.start - t : t > best.end ? t - best.end : 0;
            return dist < bestDist ? span : best;
          });
          selected = { type: "record", id: nearest.id };
          restoreTab(selected);
        }
        paint();
        if (!moved) focusRecord(selected.id);
      }
      drag = null;
      tip.dataset.on = "false";
    });
    track.addEventListener("pointerleave", () => {
      if (!drag && !pan) { hoverLine.hidden = true; tip.dataset.on = "false"; }
    });
    track.addEventListener("dblclick", (event) => { event.preventDefault(); range = null; draft = null; paint(); });
    track.addEventListener("contextmenu", (event) => { event.preventDefault(); });
    track.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && range) { range = null; paint(); }
    });
    track.addEventListener("wheel", (event) => {
      event.preventDefault();
      const m = model();
      if (!m) return;
      const { domainStart, domainDuration, fullDuration } = domainState(m);
      const rect = track.getBoundingClientRect();
      const anchorFraction = clamp((event.clientX - rect.left) / Math.max(1, rect.width), 0, 1);
