<!doctype html><meta charset="utf-8">
<pre id="out">pending</pre>
<iframe id="f" src="/" style="width:1440px;height:900px;border:0"></iframe>
<script>
const f = document.getElementById("f");
f.onload = async () => {
  const out = (o) => { document.getElementById("out").textContent = JSON.stringify(o); };
  try {
    const w = f.contentWindow, doc = w.document;
    for (let i = 0; i < 40 && !doc.querySelector(".item"); i++)
      await new Promise(r => setTimeout(r, 250));
    // 直接调 openSession 而不是模拟 click（click 可能被 nav 里的 boardReturn 逻辑干扰）
    await w.openSession(doc.querySelector(".item").dataset.sid);
    await new Promise(r => setTimeout(r, 800));
    const body = doc.getElementById("dBody");
    const walker = doc.createTreeWalker(body, w.NodeFilter.SHOW_TEXT);
    let node = null;
    while (walker.nextNode()) {
      const t = walker.currentNode;
      if (t.textContent.trim().length > 8) { node = t; break; }
    }
    if (!node) { out({ error: "no text node", crumb: doc.getElementById("crumb").textContent.slice(0,40), bodyLen: body.innerHTML.length, bodyHtml: body.innerHTML.slice(0,150) }); return; }
    const sel = w.getSelection();
    sel.removeAllRanges();
    const r = doc.createRange();
    r.setStart(node, 0);
    r.setEnd(node, Math.min(8, node.textContent.length));
    sel.addRange(r);
    const selText1 = sel.toString();
    const inBody1 = body.contains(sel.anchorNode) && !sel.isCollapsed;
    await new Promise(r => setTimeout(r, 2600));
    const sel2 = w.getSelection();
    out({ selText1, inBody1,
      after: { collapsed: sel2.isCollapsed,
               inBody: sel2.rangeCount && body.contains(sel2.anchorNode),
               text: sel2.toString() } });
  } catch (e) { out({ error: String(e) }); }
};
</script>
